# Verifica cada push a main (y cada PR): tipos y tests.
#
# Quien PUBLICA en Cloudflare es "Workers Builds" (integración de Cloudflare
# con el repo, se ve como el check "Workers Builds: catenainstitute"). Antes este
# workflow también publicaba, con un token guardado en los secretos de GitHub;
# ese token quedó inválido y el paso fallaba en cada push (el sitio se
# actualizaba igual, por Workers Builds). Dos publicadores del mismo Worker solo
# confunden, así que acá queda solo la verificación: si un test se rompe, se ve
# en rojo en el commit.
name: Desplegar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # worker-configuration.d.ts no va al repo (esta en .gitignore): lo genera
      # wrangler leyendo wrangler.jsonc. Sin este paso el typecheck no compila.
      - name: Generar los tipos del Worker
        run: npm run tipos

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # La lista de <link rel="modulepreload"> de cada pantalla tiene que
      # coincidir con sus import: si quedó vieja, vuelve la carga en cascada.
      - name: Precargas de módulos al día
        run: node scripts/precargas.mjs --verificar
