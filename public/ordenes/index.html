<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Órdenes de trabajo</title>
<!-- precargas:inicio -->
<link rel="modulepreload" href="/ordenes/js/app.js">
<link rel="modulepreload" href="/ordenes/js/catalogo.js">
<link rel="modulepreload" href="/ordenes/js/lista.js">

<link rel="modulepreload" href="/ordenes/js/guia-hoja.js">

<link rel="modulepreload" href="/lotes/js/entorno-ot.js">
<link rel="modulepreload" href="/lotes/js/dialogos.js">
<link rel="modulepreload" href="/lotes/js/numero-ot.js">
<link rel="modulepreload" href="/lotes/js/carpeta-ot.js">

<link rel="stylesheet" href="/shared/estilo.css">
<style>
  /* Órdenes de trabajo: solo tokens de estilo.css y clases ord-* propias. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans)}
  .ord{max-width:1100px;margin:0 auto;padding:18px 24px 40px}
  .ord-tit{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1;margin:10px 0 18px}
  .ord-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .ord-msg{color:var(--muted);font-size:14px;line-height:1.5;padding:18px 0;margin:0}
  .ord a:focus-visible,.ord button:focus-visible,.ord input:focus-visible,.ord select:focus-visible{outline:none;box-shadow:var(--ci-ring)}

  /* Sub-navegación: ← Inicio · Nueva orden · Pendientes · Historial */
  .ord-nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin:0 0 16px;font-size:13.5px}
  .ord-nav a{color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:var(--ci-r);border-bottom:2px solid transparent}
  .ord-nav a:hover{color:var(--accent)}
  .ord-nav a[aria-current="page"]{color:var(--txt);font-weight:600;border-bottom-color:var(--accent)}
  /* El «·» lo dibuja el CSS (fuera del subrayado del enlace activo); en el celular,
   * donde la fila puede cortarse, no se dibuja: no queda un «·» colgando. */
  .ord-nav a{position:relative}
  .ord-nav a + a{margin-left:8px}
  .ord-nav a + a::before{content:"·";position:absolute;left:-8px;color:var(--line);pointer-events:none}

  /* Portada: tres tarjetas como las del portal (filete de tinta arriba). */
  .ord-portada{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(var(--n,3),1fr);border-top:1px solid var(--rule)}
  .ord-tarj{display:flex;flex-direction:column;gap:8px;height:100%;padding:22px 22px 18px;border-left:1px solid var(--line);color:var(--txt);text-decoration:none;position:relative;min-height:150px}
  .ord-portada li:first-child .ord-tarj{border-left:0}
  .ord-tarj::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.3,.7,.2,1)}
  .ord-tarj:hover,.ord-tarj:focus-visible{background:var(--panel)}
  .ord-tarj:hover::before,.ord-tarj:focus-visible::before{transform:scaleX(1)}
  .ord-nm{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1}
  .ord-ds{font-size:14px;line-height:1.5;color:var(--muted)}
  .ord-rl{margin-top:auto;padding-top:6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

  /* Nueva orden: buscador y columnas por módulo. */
  .ord-busca{width:100%;max-width:640px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:var(--ci-r);padding:12px 14px;font:16px var(--sans);min-height:var(--ci-tap)}
  .ord-busca:focus{border-color:var(--txt)}
  .ord-ayuda{color:var(--muted);font-size:12px;margin:6px 0 0}
  .ord-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:20px}
  .ord-col h2{margin:0 0 6px;font:500 10px var(--sans);text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--rule)}
  .ord-col ul{list-style:none;margin:0;padding:0}
  .ord-tipo{display:block;padding:10px 12px;min-height:var(--ci-tap);border-bottom:1px solid var(--line);color:var(--txt);text-decoration:none;border-left:3px solid transparent}
  .ord-tipo:hover{background:var(--panel)}
  .ord-tipo.on{background:var(--panel);border-left-color:var(--accent)}
  .ord-tipo b{display:block;font-weight:600;font-size:14px}
  .ord-tipo span{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}

  /* Pendientes / Historial: la tabla, con embudos ▾ y orden en los títulos
   * (embudo.js). Mismo aspecto que los embudos de Lotes (.mfilt-panel). */
  .ord-resumen{display:flex;align-items:center;gap:14px;padding:10px 0 8px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
  .ord-limpiar{background:transparent;border:none;color:var(--accent);font:600 12.5px var(--sans);cursor:pointer;padding:4px 2px}
  .ord-limpiar:hover{text-decoration:underline}
  .ord-th{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
  .ord-ord{background:transparent;border:none;padding:4px 2px;margin:-4px 0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
  .ord-ord:hover{color:var(--txt)}
  .ord-flecha{display:inline-block;min-width:1em;margin-left:3px;font-size:9px;color:var(--accent)}
  .ord-emb{background:transparent;border:1px solid transparent;border-radius:2px;width:22px;height:22px;padding:0;color:var(--muted);font-size:11px;line-height:20px;cursor:pointer}
  .ord-emb:hover{border-color:var(--line);color:var(--txt)}
  .ord-emb.on{border-color:var(--accent);color:var(--accent);background:var(--panel)}
  .ord-emb[aria-expanded="true"]{border-color:var(--txt);color:var(--txt)}
  .ord-vacia{color:var(--muted);text-align:center;padding:22px 10px}
  .ord-emb-panel{position:fixed;z-index:1100;min-width:200px;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:0 10px 28px rgba(28,27,25,.14);padding:8px;font:13px var(--sans);color:var(--txt)}
  .ord-emb-busca{width:100%;box-sizing:border-box;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:2px;padding:6px 8px;font:13px var(--sans);margin-bottom:6px}
  .ord-emb-lista{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:1px}
  .ord-emb-opt{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:2px;cursor:pointer;white-space:nowrap}
  .ord-emb-opt:hover{background:var(--panel2)}
  .ord-emb-opt[hidden]{display:none}
  .ord-emb-opt input{margin:0;cursor:pointer;accent-color:var(--accent)}
  .ord-emb-todas{font-weight:600;border-bottom:1px solid var(--line);margin-bottom:2px;padding-bottom:6px}
  .ord-emb-nada{color:var(--muted);margin:6px;font-size:12.5px}
  .ord-emb-campo{display:flex;flex-direction:column;gap:4px;font:500 10px var(--sans);text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);padding:2px}
  .ord-emb-campo + .ord-emb-campo{margin-top:8px}
  .ord-emb-campo input{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:2px;padding:6px 8px;font:13.5px var(--sans);text-transform:none;letter-spacing:0}
  .ord-tabla-caja{overflow-x:auto}
  .ord-tabla{min-width:640px}
  .ord-fila{position:relative;cursor:pointer}
  .ord-fila:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
  .ord-abrir{color:var(--txt);font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}
  .ord-abrir::after{content:"";position:absolute;inset:0}
  .ord a.ord-abrir:focus-visible{box-shadow:none}
  .ord-mod{margin-right:6px}
  .ord-mas{color:var(--muted)}

  /* Guía de trabajos: la hoja ES el papel RCI 08 (blanco, Arial), como las hojas de Lotes. */
  .gt-barra{display:flex;gap:12px;align-items:center;margin:0 0 12px}
  .gt-estado{color:var(--muted);font-size:13px}
  .gt-hoja{background:#fff;color:#111;max-width:820px;margin:0 auto;padding:28px 34px;border-radius:6px;font-family:Arial,sans-serif;display:flex;flex-direction:column}
  .gt-tabla{width:100%;border-collapse:collapse;font-size:14px}
  .gt-tabla th{font-weight:400;text-align:left;padding:0}
  .gt-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:10px;color:#444;text-align:right;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px}
  .gt-empresa{color:#111;font-size:12px;font-weight:700;white-space:nowrap}
  .gt-tit{font-size:18px;font-weight:700;text-align:center;margin:6px 0 10px;border:1.5px solid #333;padding:6px 10px}
  .gt-meta{display:flex;gap:26px;font-size:13px;margin-bottom:10px}
  .gt-n{margin-left:auto}
  .gt-numot{display:inline-block;min-width:4.5em;border-bottom:1px solid #999;outline:none;font-weight:700;font-variant-numeric:tabular-nums}
  .gt-numot[contenteditable]:focus{background:#fff8e1}
  .gt-banda{font-size:13px;font-weight:700;background:#eee;padding:6px 10px;border:1.5px solid #333}
  /* El marco de los renglones: sigue a la banda (izq./der.) y lo cierra el relleno. */
  .gt-tabla tbody{border-left:1.5px solid #333;border-right:1.5px solid #333}
  .gt-relleno{flex:1 0 auto;min-height:60px;border:1.5px solid #333;border-top:0}
  .gt-r td{border-bottom:1px solid #ccc;padding:9px 6px;vertical-align:top}
  .gt-num{width:28px;text-align:right;color:#444;font-variant-numeric:tabular-nums}
  .gt-chk{width:30px}
  .gt-caja{display:inline-block;width:16px;height:16px;border:1.5px solid #333}
  .gt-nota .gt-cel{padding-left:22px;font-style:italic}
  .gt-txt{min-height:1.4em;outline:none;white-space:pre-wrap;word-break:break-word}
  .gt-txt[contenteditable]:focus{background:#fff8e1;box-shadow:0 0 0 2px #e0b84c}
  .gt-txt[contenteditable]:empty::before{content:attr(data-ph);color:#999}
  a.gt-orden{color:#7a1f2b;font-weight:600;text-decoration:none}
  a.gt-orden::before,.gt-ordtxt::before{content:"Orden pendiente · ";font-weight:400;color:#666}
  .gt-ordtxt{font-weight:600;color:#7a1f2b}
  .gt-ctl{white-space:nowrap;text-align:right;width:1%}
  .gt-b{padding:2px 7px;min-height:28px;font-size:13px;margin-left:2px}
  .gt-vacia{padding:18px 6px;color:#666}
  .gt-agregar{margin:12px 0 4px}
  .gt-firmas{display:flex;flex-wrap:wrap;gap:10px 30px;margin-top:28px;font-size:13px}
  .gt-firma{display:inline-block;min-width:140px;border-bottom:1px solid #999;outline:none}
  .gt-firma[contenteditable]:focus{background:#fff8e1}
  .gt-extra{max-width:820px;margin:14px auto 0;font-size:13.5px}
  .gt-extra summary{cursor:pointer;color:var(--muted)}
  .gt-extra ul{margin:6px 0 0;padding-left:18px}
  .gt-extra li{margin:4px 0}
  .gt-mut{color:var(--muted)}
  .gt-barra .ot-carpeta a{color:var(--muted)}

  /* Diálogo "Imprimir y guardar" de guardar-ot.js (Lotes): los mismos estilos que en Prensas. */
  .overlay{position:fixed;inset:0;background:rgba(28,27,25,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .overlay .box{background:var(--panel);border-top:2px solid var(--rule);border-radius:2px;padding:24px 28px;max-width:420px;text-align:center;box-shadow:0 20px 50px rgba(28,27,25,.25)}
  .overlay .box h2,.overlay .box h3{font-family:var(--serif);font-weight:500;font-size:24px}
  .overlay button.btn{background:transparent;color:var(--txt);border:1px solid var(--txt);border-radius:2px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;font-family:var(--sans);line-height:1.2;white-space:nowrap;transition:border-color .15s,background .15s,color .15s}
  .overlay button.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tinte)}
  .overlay button.btn.primary{background:var(--accent);color:#F3EEE6;border-color:var(--accent)}
  .overlay button.btn.primary:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .overlay button.btn.primary:disabled{opacity:.35;cursor:default;background:var(--accent)}
  .overlay input.txt{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:2px;padding:7px 10px;font-size:13.5px;font-family:inherit}
  .overlay input.txt:focus{border-color:var(--txt);outline:none}
  .overlay .msg{padding:9px 14px;border-radius:2px;font-size:13px;margin:10px 0;border-left:3px solid}
  .overlay .msg.ok{background:var(--ok-tinte);color:#3F5035;border-color:var(--ok)}
  .overlay .msg.err{background:var(--nook-tinte);color:var(--nook);border-color:var(--nook)}
  .overlay .msg.info{background:var(--panel);color:var(--muted);border-color:var(--line)}
  @media print{
    .ord-tit,#ordNav,.gt-barra,.gt-ctl,.gt-agregar,#gtExtras,.overlay{display:none!important}
    @page{size:A4;margin:12mm}
    body{background:#fff}
    .ord{max-width:none;padding:0}
    .gt-hoja{max-width:none;padding:0;border-radius:0;min-height:262mm}
    .gt-txt[contenteditable]:empty::before{content:""}
    a.gt-orden{color:#111}
    .gt-ordtxt{color:#111}
    .gt-r{break-inside:avoid}
  }
  @media screen and (max-width:760px){
    /* "screen": sin esto, la hoja impresa (área A4 ~703px de ancho) entra en
     * esta misma consulta y estas reglas de celular (grilla .gt-r, relleno)
     * pisan los resets de @media print porque este bloque va DESPUÉS en el CSS. */
    .ord{padding:12px 16px 32px}
    .ord-tit{font-size:32px}
    .ord-portada{grid-template-columns:1fr}
    .ord-tarj{border-left:0;border-top:1px solid var(--line);padding:18px 4px;min-height:0}
    .ord-portada li:first-child .ord-tarj{border-top:0}
    .ord-nav a{min-height:var(--ci-tap);display:inline-flex;align-items:center}
    .ord-nav a + a{margin-left:0}
    .ord-nav a + a::before{content:none}
    .ord-emb{width:var(--ci-tap);height:var(--ci-tap)}
    .ord-emb-busca,.ord-emb-campo input{font-size:16px;min-height:var(--ci-tap)}
    .ord-emb-opt{min-height:var(--ci-tap)}
    /* Guía de trabajos: menos relleno y los controles (5 botones) se bajan a su
     * propia línea; si no, la celda .gt-ctl (nowrap) empuja el texto a ~4 caracteres.
     * body:not(.printing-guia): el PDF de "Imprimir y guardar" (hoja-pdf.js) dibuja la
     * hoja en una copia de 182 mm (~688px) de ancho con la clase printing-guia en el
     * body: ahí esta consulta SÍ entra, y sin el :not el PDF saldría con la grilla de celular. */
    body:not(.printing-guia) .gt-hoja{padding:16px 12px}
    body:not(.printing-guia) .gt-n{margin-left:0}
    body:not(.printing-guia) .gt-top{flex-wrap:wrap;text-align:left}
    body:not(.printing-guia) .gt-r{display:grid;grid-template-columns:28px 30px 1fr;border-bottom:1px solid #ccc}
    body:not(.printing-guia) .gt-r > td{border-bottom:0}
    body:not(.printing-guia) .gt-ctl{grid-column:3;text-align:left;width:auto;white-space:normal;padding-top:0}
  }
  @media (prefers-reduced-motion:reduce){.ord-tarj::before{transition:none}}
</style>
<link rel="stylesheet" href="/shared/ciw-responsive-02.css?v=sync1">
</head>
<body>
<main id="ord" class="ord">
  <h1 class="ord-tit">Órdenes de trabajo</h1>
  <div id="ordNav"></div>
  <div id="ordCuerpo"><p class="ord-msg">Cargando órdenes…</p></div>
</main>
<script type="module" src="/ordenes/js/app.js"></script>
</body>
</html>
