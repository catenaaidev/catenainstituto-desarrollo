<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario · CIW</title><style>
body{margin:0;font:15px system-ui,sans-serif;color:#101828;background:#f5f6f8}main{max-width:1080px;margin:auto;padding:32px 20px}h1{font-size:36px;margin:8px 0}p{line-height:1.6;color:#667085} .eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#8e1f45}.inv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));gap:16px;margin-top:24px}.inv-card{display:flex;flex-direction:column;min-height:210px;background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:22px;text-decoration:none;color:#101828;box-shadow:0 2px 8px #10182808}.inv-card:hover{border-color:#8e1f45}.inv-card:focus-visible{outline:3px solid #8e1f45}.inv-card h2{font-size:21px;margin:14px 0 0}.inv-card .area{font-size:12px;font-weight:600;color:#8e1f45}.inv-card p{flex:1;margin:12px 0}.inv-card .go{font-weight:600;color:#8e1f45;margin-top:14px}.note{font-size:13px;margin-top:24px}.state{padding:14px;border:1px solid #e4e7ec;border-radius:12px;background:white}
</style></head><body><main><span class="eyebrow">CATENA INSTITUTE OF WINE</span><h1>Inventario</h1><p>Todos los inventarios de CIW en un solo lugar. Elegí qué necesitás consultar o actualizar.</p><div id="inventarios" class="inv-grid" aria-live="polite"></div><p class="note">Cada inventario conserva sus datos, permisos, guardado y operaciones originales. El padrón define las vasijas; no es otro inventario de existencias.</p></main><script type="module">
import {inventarios} from '/inventario/catalogo.js';
const cont=document.getElementById('inventarios');
const items=inventarios(window.CIW?.modulos || {});
if(!items.length){const p=document.createElement('p');p.className='state';p.textContent='No tenés acceso a los inventarios. Consultá al administrador.';cont.append(p);}
for(const item of items){const a=document.createElement('a');a.className='inv-card';a.href=item.href;for(const [tag,cls,txt] of [['span','area',item.area],['h2','',item.titulo],['p','',item.detalle],['span','go','Abrir inventario →']]){const e=document.createElement(tag);e.className=cls;e.textContent=txt;a.append(e);}cont.append(a);}
</script></body></html>
