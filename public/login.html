<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Catena Institute</title>
<style>
@font-face{font-family:Fraunces;src:url('/prensas/fonts/fraunces-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Hanken;src:url('/prensas/fonts/hanken-grotesk-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Hanken;src:url('/prensas/fonts/hanken-grotesk-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
:root{--bg:#f7f5f1;--panel:#fff;--line:#e7e3da;--txt:#2a2622;--muted:#8c857b;--accent:#8a3340;--accent2:#6f2731}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:Hanken,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px;box-shadow:0 18px 50px -35px rgba(42,38,34,.35)}
h1{font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:600;margin:0 0 4px}.sub{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:2.2px}
p{color:var(--muted);font-size:14px;line-height:1.55}.field{margin:20px 0 0}label{display:block;font-size:12px;font-weight:600;margin-bottom:7px}
input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt);font:inherit;font-size:14px}input:focus{outline:2px solid rgba(138,51,64,.18);border-color:var(--accent)}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:white;font:600 14px Hanken,system-ui;cursor:pointer}button:hover{background:var(--accent2)}button:disabled{opacity:.65;cursor:wait}
.error{display:none;margin-top:16px;padding:11px 13px;border-radius:8px;background:#fdf3f2;border:1px solid #e9c9c5;color:#8c3b32;font-size:13px;line-height:1.45}
.footer{margin-top:22px;text-align:center;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<main class="card">
  <h1>Plataforma CIW</h1>
  <div class="sub">Catena Institute</div>
  <p>Ingresá con tu usuario y contraseña para acceder a los módulos que tenés asignados.</p>
  <form id="form" autocomplete="on">
    <div class="field"><label for="usuario">Usuario</label><input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
    <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button id="submit" type="submit">Ingresar</button>
    <div id="error" class="error">El usuario o la contraseña no son correctos.</div>
  </form>
  <div class="footer">Bodegas Esmeralda · Catena Institute</div>
</main>
<script>
(async()=>{
  // Quien todavía tiene la contraseña inicial va directo a cambiarla.
  const destino=j=>j&&j.debe_cambiar?'/cambiar-clave.html':'/';
  try { const r=await fetch('/api/auth/me',{cache:'no-store'}); if(r.ok){location.replace(destino(await r.json()));return;} } catch(e){}
  const form=document.getElementById('form'), btn=document.getElementById('submit'), err=document.getElementById('error');
  form.addEventListener('submit',async e=>{
    e.preventDefault(); err.style.display='none'; btn.disabled=true; btn.textContent='Ingresando…';
    try{
      const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:form.usuario.value,password:form.password.value})});
      if(r.ok){location.replace(destino(await r.json().catch(()=>({}))));return;}
      const j=await r.json().catch(()=>({}));
      err.textContent=r.status===401?'El usuario o la contraseña no son correctos.'
        :j.error==='base_sin_inicializar'?'El sistema todavía no está configurado.'
        :'Error del servidor ('+r.status+')'+(j.detalles&&j.detalles[0]?': '+j.detalles[0]:'')+'. Avisá a quien administra la plataforma.';
      err.style.display='block';
    }catch(e){err.textContent='No se pudo conectar con el servidor. Intentá nuevamente.';err.style.display='block';}
    btn.disabled=false; btn.textContent='Ingresar';
  });
})();
</script>
</body>
</html>
